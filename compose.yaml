services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pizzeria_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://pizzeria_user:pizzeria_password@db:3306/pizzeria_db"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: pizzeria_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: pizzeria_db
      MYSQL_USER: pizzeria_user
      MYSQL_PASSWORD: pizzeria_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
